[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "reboot"
version = "0.1.0"
description = "ReBoot: physics-structured self-supervised pretraining for label-efficient battery state-of-charge estimation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Marouane Tliba" },
    { name = "Slimane Arbaoui" },
]

dependencies = [
    "torch>=2.1",
    "pytorch-lightning>=2.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://mtliba.github.io/reboot/"
Repository = "https://github.com/mtliba/reboot"

[project.scripts]
reboot-pretrain = "scripts.pretrain:main"
reboot-finetune = "scripts.finetune:main"
reboot-evaluate = "scripts.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["reboot"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
